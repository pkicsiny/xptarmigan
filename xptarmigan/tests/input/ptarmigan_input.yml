control:
  rng_seed: 1
  dt_multiplier: 1
  lcfa: false
  radiation_reaction: true
  pair_creation: false

laser:
  a0: 1.338877362790406
  wavelength: 0.8 * micro
  fwhm_duration: 48 * femto
  waist: 1.8 * micro
  polarization: linear

beam:
  from_hdf5:
    file: ptarmigan_input_ebeam.h5
    distance_bt_ips: 0.0
  species: electron
  collision_angle: 208.1 * degree
  offset: [0, 0, 0]

output:
  ident: ptarmigan_output
  coordinate_system: beam
  discard_background: false
  dump_all_particles: hdf5
  file_format: fits
  photon:
    - energy
    - energy:(auto; auto; angle in 0, 100 * micro)
    - angle_x:angle_y:(auto; auto; angle in 0, 20 * micro)
